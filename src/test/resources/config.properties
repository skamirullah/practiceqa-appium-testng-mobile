# Defaults. Override any of these with -Dname=value or an environment variable (PLATFORM, APPIUM_URL, DEVICE_NAME ...).
base.url=https://www.practiceqaautomation.com

# Where the tests run:
#   android    Chrome on an Android device or emulator, through Appium (UiAutomator2)
#   ios        Safari on an iPhone or simulator, through Appium (XCUITest)
#   emulation  Chrome on this computer pretending to be a phone; needs no Appium or device
platform=emulation

# Appium server (android and ios only).
appium.url=http://127.0.0.1:4723

# Device to use. Leave device.udid empty to use the only connected device or running emulator.
device.name=Pixel 7
device.udid=
platform.version=

# Phone that Chrome imitates when platform=emulation.
emulation.device=Pixel 7
headless=true

# Seconds to wait for an element or condition before failing.
timeout=15
